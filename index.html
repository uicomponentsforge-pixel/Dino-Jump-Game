<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dino Jump</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="wrap">
  <div class="top"><h1>DINO JUMP</h1><div class="scores"><span>SCORE <b id="score">00000</b></span><span>HI <b id="hi">00000</b></span></div></div>
  <div class="game"><canvas id="game" width="900" height="280" aria-label="Dino jumping game"></canvas></div>
  <p class="help">Press SPACE / ↑ or tap the game to jump. Press ↓ to duck. Avoid the cacti!</p>
  <div class="controls"><button id="start">Start / Restart</button><button id="pause">Pause</button></div>
</main>
<script src="script.js"></script>
</body>
</html>
